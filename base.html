<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Helping Hand Insured</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #fdf8f2;
            /* light cream */
            color: #333;
        }

        .navbar-custom {
            background-color: #1e5631;
            /* green from logo */
            padding: 0.75rem 1.5rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
        }

        .navbar-brand {
            font-weight: 600;
            font-size: 1.4rem;
            color: #ffffff !important;
            display: flex;
            align-items: center;
        }

        .navbar-brand img {
            height: 40px;
            margin-right: 10px;
        }

        .nav-link {
            color: #ffffff !important;
            font-weight: 500;
            border-radius: 0.35rem;
            padding: 6px 12px;
            transition: background-color 0.2s ease-in-out, color 0.2s ease-in-out;
        }

        .nav-link:hover,
        .nav-link.active {
            background-color: #fdf8f2;
            /* cream */
            color: #1e5631 !important;
        }

        .nav-register {
            background-color: #fdf8f2;
            color: #1e5631 !important;
            font-weight: 600;
            border-radius: 0.35rem;
        }

        .nav-register:hover,
        .nav-register.active {
            background-color: #d4d2c5;
            color: #1e5631 !important;
        }

        .alert {
            border-radius: 0.35rem;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Helping Hand Logo">
                Helping Hand Insured
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" style="filter: invert(100%)"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/about' %}active{% endif %}" href="/about">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/services' %}active{% endif %}"
                            href="/services">Services</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/registration' %}active nav-register{% endif %}"
                            href="/registration">Register</a>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/contact' %}active{% endif %}"
                            href="/contact">Contact</a>
                    </li>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Flash messages -->
    <div class="container mt-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="mb-4">
            {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}
    </div>

    <!-- Page Content -->
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
