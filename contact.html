{% extends "base.html" %}

{% block content %}
<style>
    .contact-container {
        background-color: #fdf8f2;
        /* light cream */
        padding: 3rem 2rem;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
        margin-top: 60px;
    }

    .contact-container h1 {
        font-weight: 600;
        color: #1e5631;
        margin-bottom: 1rem;
        text-align: center;
    }

    .contact-container .lead {
        font-size: 1.2rem;
        color: #555;
        margin-bottom: 2rem;
        text-align: center;
    }

    .form-label {
        font-weight: 500;
        color: #1e5631;
    }

    .form-control:focus {
        border-color: #1e5631;
        box-shadow: 0 0 0 0.2rem rgba(30, 86, 49, 0.25);
    }

    .btn-submit {
        background-color: #1e5631;
        color: #fff;
        font-weight: 600;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        transition: background-color 0.2s ease;
    }

    .btn-submit:hover {
        background-color: #154c28;
    }
</style>

<div class="container contact-container">
    <h1>Contact Us</h1>
    <p class="lead">Have a question or need a quote? Send us a message and we'll get back to you soon.</p>

    <form method="POST" action="/contact">
        <div class="mb-3">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="John Doe" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="mb-3">
            <label for="subject" class="form-label">Subject</label>
            <input type="text" class="form-control" id="subject" name="subject" placeholder="Auto Insurance Inquiry"
                required>
        </div>
        <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" name="message" rows="5" placeholder="Write your message here..."
                required></textarea>
        </div>
        <button type="submit" class="btn btn-submit">Send Message</button>
    </form>
</div>
{% endblock %}
